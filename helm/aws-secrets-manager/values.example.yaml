# Example for EKS with IRSA and an ALB. Copy to values-<env>.yaml (gitignored) and adjust.
image:
  repository: dinhdobathi/aws-secrets-manager
  tag: "2.0.0"

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<HUB_ACCOUNT_ID>:role/<HUB_ROLE>
    eks.amazonaws.com/sts-regional-endpoints: "true"

app:
  url: https://secrets.example.com
  name: "Secrets Console"

accounts:
  - id: dev
    name: Development
    region: ap-southeast-1
    roleArn: arn:aws:iam::<DEV_ACCOUNT_ID>:role/secrets-console
    groups:
      reader: <entra-group-object-id>
      writer: <entra-group-object-id>
      admin: <entra-group-object-id>
  - id: prod
    name: Production
    region: ap-southeast-1
    roleArn: arn:aws:iam::<PROD_ACCOUNT_ID>:role/secrets-console
    groups:
      reader: <entra-group-object-id>
      writer: <entra-group-object-id>
      admin: <entra-group-object-id>

auth:
  # Create it with ESO or: kubectl create secret generic secrets-console-auth \
  #   --from-literal=SESSION_SECRET=... --from-literal=ENTRA_TENANT_ID=... \
  #   --from-literal=ENTRA_CLIENT_ID=... --from-literal=ENTRA_CLIENT_SECRET=...
  existingSecret: secrets-console-auth

ingress:
  enabled: true
  className: alb
  annotations:
    # A console that can reveal secrets: keep it internal (VPN / private network) unless you
    # deliberately expose it; if internet-facing, restrict sources (inbound-cidrs or a WAF ACL).
    alb.ingress.kubernetes.io/scheme: internal
    # alb.ingress.kubernetes.io/inbound-cidrs: 10.0.0.0/8
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<REGION>:<ACCOUNT_ID>:certificate/<CERT_ID>
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
  hosts:
    - host: secrets.example.com
      paths:
        - path: /
          pathType: Prefix
