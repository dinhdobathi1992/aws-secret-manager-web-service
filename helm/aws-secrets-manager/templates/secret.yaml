{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-secrets-manager.authSecretName" . }}
  labels:
    {{- include "aws-secrets-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.auth.sessionSecret | quote }}
  ENTRA_TENANT_ID: {{ .Values.auth.tenantId | quote }}
  ENTRA_CLIENT_ID: {{ .Values.auth.clientId | quote }}
  ENTRA_CLIENT_SECRET: {{ .Values.auth.clientSecret | quote }}
{{- end }}
