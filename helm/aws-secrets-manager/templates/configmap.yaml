apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aws-secrets-manager.fullname" . }}
  labels:
    {{- include "aws-secrets-manager.labels" . | nindent 4 }}
data:
  ACCOUNTS: {{ toJson .Values.accounts | quote }}
  APP_URL: {{ .Values.app.url | quote }}
  APP_NAME: {{ .Values.app.name | quote }}
  APP_LOGO_URL: {{ .Values.app.logoUrl | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
